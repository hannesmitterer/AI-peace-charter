name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'index.html'
      - 'styles.css'
      - 'script.js'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4
      
      - name: 📦 Prepare deployment files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp styles.css _site/
          cp script.js _site/
          cp README.md _site/
          cp -r scripts _site/ 2>/dev/null || true
          
          # Create .nojekyll to bypass Jekyll processing
          touch _site/.nojekyll
          
          # Generate deployment info
          cat > _site/deploy-info.json << EOF
          {
            "deployment_time": "$(date -Iseconds)",
            "commit_sha": "${{ github.sha }}",
            "commit_message": "${{ github.event.head_commit.message }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}"
          }
          EOF
          
          echo "✅ Deployment files prepared"
          ls -la _site/
      
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: 📊 Deployment summary
        run: |
          echo "## 🚀 Dashboard Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -Iseconds)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Deployed Files" >> $GITHUB_STEP_SUMMARY
          echo "- index.html (Dashboard principale)" >> $GITHUB_STEP_SUMMARY
          echo "- styles.css (Stili responsive)" >> $GITHUB_STEP_SUMMARY
          echo "- script.js (Logica interattiva)" >> $GITHUB_STEP_SUMMARY
          echo "- scripts/ (Script di deployment)" >> $GITHUB_STEP_SUMMARY
